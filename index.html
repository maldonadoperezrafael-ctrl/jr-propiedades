  <style>
    :root {
      --greige: #E6E1DD;
      --greige-2: #F1EDE9;
      --blanco: #FFFFFF;
      --grafito: #414143;
      --grafito-2: #2E2E30;
      --gris: #646263;
      --tinta: #1F1E1E;
      --texto-suave: #55524F;
      --linea: #CFC8C1;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;

      --sombra: 0 10px 30px rgba(31, 30, 30, .08);

    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: var(--sans); font-size: 1.0625rem; line-height: 1.65; color: var(--tinta); background: var(--greige); }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.1; margin: 0; letter-spacing: -.01em; }
    h2 { font-size: clamp(2rem, 4.5vw, 3rem); }
    p { margin: 0 0 1rem; }
    .contenedor { width: min(100% - 2.5rem, var(--max)); margin-inline: auto; }
    .seccion { padding-block: clamp(3.5rem, 8vw, 6.5rem); }

    .saltar { position: absolute; left: 1rem; top: -3rem; background: var(--grafito); color: #fff; padding: .6rem 1rem; z-index: 100; }
    .saltar:focus { top: 1rem; }

    /* Encabezado */
    .encabezado { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.94); backdrop-filter: saturate(1.2) blur(10px); border-bottom: 1px solid var(--linea); }
    .encabezado .contenedor { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 84px; }
    .marca { display: inline-flex; color: var(--tinta); }
    .marca svg { height: 64px; width: auto; }
    .menu { display: flex; gap: clamp(1rem, 2.5vw, 2.25rem); list-style: none; margin: 0; padding: 0; }
    .menu a { display: inline-flex; align-items: center; min-height: 44px; font-family: var(--serif); font-size: 1.125rem; text-decoration: none; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid transparent; transition: border-color .2s; }
    .menu a:hover, .menu a[aria-current="true"] { border-color: var(--tinta); }
    .boton { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: .75rem 1.5rem; border-radius: var(--radio); background: var(--grafito); color: #fff; font-family: var(--sans); font-weight: 500; font-size: .875rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--grafito); cursor: pointer; transition: background .2s, color .2s, transform .2s; }
    .boton:hover { background: var(--grafito-2); transform: translateY(-1px); }
    .boton.secundario { background: transparent; color: var(--tinta); border-color: var(--tinta); }
    .boton.secundario:hover { background: var(--tinta); color: #fff; }
    .abrir-menu { display: none; background: none; border: 0; width: 48px; height: 48px; cursor: pointer; color: var(--tinta); }
    .abrir-menu span { display: block; width: 26px; height: 2px; background: currentColor; margin: 6px auto; transition: transform .25s, opacity .25s; }
    .abrir-menu[aria-expanded="true"] span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .abrir-menu[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .abrir-menu[aria-expanded="true"] span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* Portada */
    .portada { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; align-items: stretch; margin-top: clamp(1.5rem, 4vw, 3rem); }
    .portada figure { margin: 0; min-height: 420px; }
    .portada figure img { width: 100%; height: 100%; object-fit: cover; }
    .portada .tarjeta { background: var(--blanco); border: 1px solid var(--tinta); padding: clamp(2rem, 5vw, 4rem); display: flex; flex-direction: column; justify-content: center; }
    .portada h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); margin-bottom: 1.25rem; }
    .portada p { font-size: 1.125rem; color: var(--texto-suave); max-width: 34ch; }
    .acciones { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
    .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--linea); }
    .cifras strong { display: block; font-family: var(--serif); font-size: 2rem; font-weight: 600; line-height: 1; }
    .cifras span { font-size: .8125rem; color: var(--texto-suave); letter-spacing: .04em; }

    /* Propiedades */
    .cabecera-seccion { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    .etiqueta { font-size: .8125rem; letter-spacing: .18em; text-transform: uppercase; color: var(--texto-suave); margin-bottom: .5rem; display: block; }
    .filtros { display: flex; flex-wrap: wrap; gap: .5rem; }
    .filtros button { min-height: 44px; padding: .5rem 1.1rem; border-radius: 999px; border: 1px solid var(--tinta); background: transparent; font: 500 .875rem var(--sans); letter-spacing: .06em; cursor: pointer; color: var(--tinta); }
    .filtros button[aria-pressed="true"] { background: var(--tinta); color: #fff; }
    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.5rem; }
    .propiedad { background: var(--blanco); box-shadow: var(--sombra); display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s; }
    .propiedad:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(31,30,30,.12); }
    .propiedad figure { margin: 0; position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
    .propiedad figure img { width: 100%; height: 100%; object-fit: cover; }
    .propiedad .sello { position: absolute; top: .75rem; left: .75rem; background: var(--blanco); color: var(--tinta); font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: .3rem .6rem; border-radius: 2px; }
    .propiedad .cuerpo { padding: 1.25rem 1.25rem 1.4rem; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
    .propiedad h3 { font-size: 1.6rem; }
    .propiedad .lugar { font-size: .9375rem; color: var(--texto-suave); display: flex; align-items: center; gap: .35rem; margin: 0; }
    .propiedad .datos { display: flex; gap: 1.1rem; list-style: none; padding: .75rem 0 0; margin: .5rem 0 0; border-top: 1px solid var(--linea); font-size: .9375rem; }
    .propiedad .datos li { display: flex; align-items: center; gap: .4rem; }
    .propiedad .precio { margin-top: auto; padding-top: .75rem; font-family: var(--serif); font-size: 1.5rem; font-weight: 600; }
    .icono { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .nota-ejemplo { font-size: .8125rem; color: var(--texto-suave); margin-top: 1.5rem; }

    /* Cita */
    .cita { margin: 0; background: var(--gris); color: #fff; border-radius: 28px; padding: clamp(2rem, 5vw, 3.5rem); text-align: center; }
    .cita p { font-family: var(--serif); font-style: italic; font-size: clamp(1.4rem, 3vw, 2.1rem); line-height: 1.35; margin: 0 auto; max-width: 46ch; }

    /* Servicios */
    .servicios { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; }
    .servicio { background: var(--blanco); padding: 2rem 1.75rem; min-height: 320px; display: flex; flex-direction: column; box-shadow: var(--sombra); }
    .servicio:nth-child(even) { background: var(--grafito); color: #fff; }
    .servicio h3 { font-size: 2.1rem; margin-bottom: 1rem; }
    .servicio p { font-size: 1rem; }
    .servicio a { margin-top: auto; align-self: flex-end; display: inline-flex; align-items: center; min-height: 44px; font-size: .8125rem; letter-spacing: .14em; text-transform: uppercase; text-underline-offset: 4px; }

    /* Proceso */
    .proceso { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
    .proceso .intro p { color: var(--texto-suave); font-size: 1.125rem; }
    .pasos { list-style: none; margin: 0; padding: 0; counter-reset: paso; display: grid; gap: 1rem; }
    .pasos li { counter-increment: paso; background: var(--blanco); padding: 1.5rem 1.5rem 1.5rem 4.75rem; position: relative; box-shadow: var(--sombra); }
    .pasos li::before { content: counter(paso, decimal-leading-zero); position: absolute; left: 1.5rem; top: 1.35rem; font-family: var(--serif); font-size: 2rem; font-weight: 600; color: var(--gris); }
    .pasos h3 { font-size: 1.6rem; margin-bottom: .35rem; }
    .pasos p { margin: 0; color: var(--texto-suave); font-size: 1rem; }

    /* Alerta + contacto */
    .alerta { display: grid; grid-template-columns: 1fr 1fr; background: var(--blanco); box-shadow: var(--sombra); }
    .alerta .texto { padding: clamp(2rem, 5vw, 3.5rem); }
    .alerta .texto p { color: var(--texto-suave); }
    .alerta form { padding: clamp(2rem, 5vw, 3.5rem); background: var(--greige-2); display: grid; gap: 1rem; align-content: center; }
    .contacto { position: relative; background: var(--grafito-2) url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1920&q=60&auto=format&fit=crop') center / cover no-repeat; }
    .contacto::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(31,30,30,.82), rgba(31,30,30,.35)); }
    .contacto .contenedor { position: relative; display: grid; grid-template-columns: 1fr minmax(320px, 520px); gap: 2rem; align-items: center; }
    .contacto .lema { color: #fff; }
    .contacto .lema h2 { font-size: clamp(2.5rem, 6vw, 4.25rem); }
    .contacto .lema p { max-width: 36ch; opacity: .92; }
    .formulario { background: var(--blanco); padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: 0 20px 50px rgba(0,0,0,.25); display: grid; gap: 1rem; }
    .formulario h3 { font-size: 2rem; }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .35rem; }
    input, select, textarea { width: 100%; min-height: 48px; padding: .7rem .9rem; font: 400 1rem var(--sans); color: var(--tinta); background: #fff; border: 1px solid #8C8580; border-radius: var(--radio); }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--grafito); outline-offset: 1px; border-color: var(--grafito); }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: #B42318; }
    .error { color: #B42318; font-size: .8125rem; margin-top: .25rem; min-height: 1em; }
    .consentimiento { display: flex; gap: .6rem; align-items: flex-start; font-size: .875rem; color: var(--texto-suave); }
    .consentimiento input { width: 20px; min-height: 20px; height: 20px; margin-top: .15rem; accent-color: var(--grafito); }
    .estado { font-size: .9375rem; padding: .75rem 1rem; border-left: 4px solid var(--grafito); background: var(--greige-2); display: none; }
    .estado.visible { display: block; }

    /* Pie */
    .pie { padding-block: 3.5rem 2rem; }
    .pie .marco { border: 1px solid var(--tinta); padding: clamp(2rem, 5vw, 3rem); display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 2rem; }
    .pie .marca svg { height: 96px; }
    .pie h2 { font-family: var(--sans); font-size: .8125rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; margin-bottom: .9rem; }
    .pie ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; font-size: .9375rem; }
    .pie a { text-decoration: none; }
    .pie a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .redes { display: flex; gap: .75rem; margin-top: 1rem; }
    .redes { display: flex; gap: 0.85rem; margin-top: 1.15rem; align-items: center; }
    .redes a { position: relative; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: none; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
    .redes a:hover { transform: translateY(-3px); }
    .redes a.red-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); box-shadow: 0 4px 10px rgba(214, 36, 159, 0.28); }
    .redes a.red-facebook { background: #1877F2; box-shadow: 0 4px 10px rgba(24, 119, 242, 0.28); }
    .redes a.red-whatsapp { background: #25D366; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.28); }
    .redes a svg.icono-red { width: 22px; height: 22px; }
    .redes a .simbolo-redireccion { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; color: #FFFFFF; opacity: 0.9; }
    .legal { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; font-size: .8125rem; color: var(--texto-suave); margin-top: 1.5rem; }
    .whatsapp { position: fixed; right: 1.25rem; bottom: 1.25rem; width: 58px; height: 58px; border-radius: 50%; background: #1F8A4C; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,.25); z-index: 40; transition: transform .2s; }
    .whatsapp:hover { transform: scale(1.06); }

    /* Adaptación a tablet y móvil */
    @media (max-width: 1024px) {
      .servicios { grid-template-columns: repeat(2, 1fr); }
      .pie .marco { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 860px) {
      .abrir-menu { display: block; }
      .navegacion { position: fixed; inset: 84px 0 auto 0; background: var(--blanco); border-bottom: 1px solid var(--linea); padding: 1.5rem 1.25rem 2rem; transform: translateY(-120%); visibility: hidden; transition: transform .3s, visibility .3s; }
      .navegacion.abierta { transform: none; visibility: visible; }
      .menu { flex-direction: column; gap: 1rem; }
      .menu a { font-size: 1.5rem; }
      .encabezado .contacto-rapido { display: none; }
      .portada, .alerta, .proceso, .contacto .contenedor { grid-template-columns: 1fr; }
      .portada figure { min-height: 260px; aspect-ratio: 4 / 3; }
    }
    @media (max-width: 560px) {
      body { font-size: 1rem; }
      .marca svg { height: 44px; }
      .servicios, .dos, .pie .marco { grid-template-columns: 1fr; }
      .cifras { grid-template-columns: repeat(3, 1fr); }
      .cifras strong { font-size: 1.6rem; }
      .servicio { min-height: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  
    @media (max-width: 600px) {
      .whatsapp { bottom: 1.25rem; right: 1.25rem; width: 50px; height: 50px; }
      .formulario .boton { margin-bottom: 2rem; }
    }

    /* =========================================================
       ESTILOS LÁMINAS 2, 4 Y 6 + REGLAS RESPONSIVAS AUDITADAS
       ========================================================= */
    /* Lámina 2: 4 botones en #servicios */
    .servicios-pildoras {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;

      text-transform: uppercase;

      transition: background 0.2s ease, transform 0.2s ease;

    }

    }
    .disciplinas-grid > div {

    .disciplinas-grid p {

      letter-spacing: 0.14em !important;
      text-transform: uppercase;
      line-height: 1.45 !important;

    .pasos-marco {

    @media (max-width: 860px) {

      }
